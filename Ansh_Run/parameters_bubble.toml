# MCMC Parameter Configuriation File
name = 'BubbleVegasModel'

#-------------- MODEL --------------
#---------------- E ----------------
[[model]]
name  = "E52"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -2.0
    upper = 4.0
    initial_guess = 2.133
    initial_sigma = 0.5

