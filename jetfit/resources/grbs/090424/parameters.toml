# MCMC Parameter Configuriation File
name = 'FireballModel'

#-------------- MODEL --------------
#---------------- E ----------------
[[model]]
name  = "E52"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -2.0
    upper = 4.0
    initial_guess = 0.50
    initial_sigma = 0.25

#-------------- MODEL --------------
#--------------- lfo ---------------
[[model]]
name  = "lf0"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = 1.69
    upper = 3.00
    initial_guess = 1.85
    initial_sigma = 0.15

#-------------- MODEL --------------
#---------------- n ----------------
[[model]]
name  = "n017"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 6.0
    initial_guess = -1.8
    initial_sigma = 0.25

