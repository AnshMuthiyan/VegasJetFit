# MCMC Parameter Configuriation File
name = 'powerlawVegasModel'

#-------------- MODEL --------------
#---------------- E ----------------
[[model]]
name  = "E52"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -2.0
    upper = 4.0

#-------------- MODEL --------------
#--------------- lfo ---------------
[[model]]
name  = "lf0"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = 1.69
    upper = 3.00

#-------------- MODEL --------------
#---------------- n ----------------
[[model]]
name  = "n017"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 6.0

#-------------- MODEL --------------
#-------------- eps_e --------------
[[model]]
name  = "eps_e"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 0.0

#-------------- MODEL --------------
#-------------- eps_b --------------
[[model]]
name  = "eps_b"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 0.0

#-------------- MODEL --------------
#---------------- p ----------------
[[model]]
name  = "p"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = 2.0
    upper = 23.0
    initial_guess = 2.05
    initial_sigma = 0.05

#-------------- MODEL --------------
#-------------- k_e ----------------
[[model]]
name = "k_e"
scale = "linear"
value = 2

#----------- MODEL ----------------
# ------------ k_g ----------------
[[model]]
name = "k_g"
scale= "linear"
value = 2

#--------- MODEL ------------------
# ----------- s ------------------
[[model]] 
name = "s"
scale = "linear"
value = 4

#-------------- MODEL --------------
#---------------- k ----------------
[[model]]
name  = "k"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = -3.0
    upper = 3.0

#-------------- MODEL --------------
#---------------- X ----------------
[[model]]
name  = "hmf"
scale = "linear"
value = 0.7

#-------------- MODEL --------------
#---------------- z ----------------
[[model]]
name  = "z"
scale = "linear"
value = 2.006

#-------------- MODEL --------------
#---------------- dL ---------------
[[model]]
name  = "dL28"
scale = "linear"
value = 4.94

#------------ MODEL --------------
#-------------theta_c -----------
[[model]]
name = "theta_c"
scale = "linear"

[model.prior]
	type = "uniform"
	lower = 0.001
	upper = 1
	initial_guess = 0.1
	initial_sigma = 0.05

#---------- MODEL ----------------
#-------------theta_v-------------
[[model]]
name = "theta_v"
scale = "linear"
#value = 0.0

[model.prior]
	type = "uniform"
	lower = 0.0001
	upper = 1
	initial_guess = 0.1
	initial_sigma = 0.05

#----------- EXTINCTION ------------
#---------- source_frame -----------
[[extinction]]
name  = "ebv_source_frame"
scale = "linear"

[extinction.prior]
    type  = "uniform"
    lower = 0.0
    upper = 0.5
    initial_guess = 0.14
    initial_sigma = 0.05

#----------- EXTINCTION ------------
#------------ milky_way ------------
[[extinction]]
name  = "ebv_milky_way"
scale = "linear"
value = 0.0647

#----------- CALIBRATION -----------
#-------------- V-band -------------
[[offsets]]
name  = "V_offset"
scale = "linear"

[offsets.prior]
    type  = "gaussian"
    mu    = 0.0
    sigma = 0.3

#----------- CALIBRATION -----------
#-------------- R-band -------------
[[offsets]]
name  = "R_offset"
scale = "linear"

[offsets.prior]
    type  = "gaussian"
    mu    = 0.0
    sigma = 0.3

#----------- CALIBRATION -----------
#-------------- I-band -------------
[[offsets]]
name  = "I_offset"
scale = "linear"

[offsets.prior]
    type  = "gaussian"
    mu    = 0.0
    sigma = 0.3

#--------------- SLOP --------------
#--------------- slop --------------
[[slop]]
name  = "slop"
scale = "linear"

[slop.prior]
    type  = "uniform"
    lower = 0.0
    upper = 0.2
    initial_guess = 0.03
    initial_sigma = 0.01
