    initial_guess = -1.43
    initial_sigma = 0.02

#----------- HOST GALAXY -----------
#-------------- i-band -------------
[[host]]
name  = "i_host"
scale = "log"

[host.prior]
    type = "uniform"
    lower = -1.50
    upper = -1.0
    initial_guess = -1.34
    initial_sigma = 0.02

#----------- HOST GALAXY -----------
#-------------- z-band -------------
