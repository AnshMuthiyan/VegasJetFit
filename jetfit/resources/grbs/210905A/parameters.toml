# MCMC Parameter Configuriation File
name = 'FireballModel'
# Source-frame dust-law references:
# Trotter, A. S. 2011, UNC-Chapel Hill PhD thesis, DOI 10.17615/2gjp-g156.
# Cardelli, Clayton, and Mathis 1989, ApJ, 345, 245 (CCM89).
# Allowed: "trotter2011" (default for new configs) or "ccm89".
source_extinction_model = 'ccm89'

#-------------- MODEL --------------
#---------------- E ----------------
[[model]]
name  = "E52"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -2.0
    upper = 4.0
#    initial_guess = 3.57
#    initial_sigma = 0.25

#-------------- MODEL --------------
#--------------- lfo ---------------
[[model]]
name  = "lf0"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = 1.69
    upper = 3.00

#-------------- MODEL --------------
#---------------- n ----------------
[[model]]
name  = "n017"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -10.0
    upper = 6.0
    initial_guess = -5.0
    initial_sigma = 5.00

#-------------- MODEL --------------
#-------------- eps_e --------------
[[model]]
name  = "eps_e"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 0.0
#    initial_guess = -1.51264
#    initial_sigma = 0.2

#-------------- MODEL --------------
#-------------- eps_b --------------
[[model]]
name  = "eps_b"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 0.0
#    initial_guess = -5.92
#    initial_sigma = 0.50

#-------------- MODEL --------------
#---------------- p ----------------
[[model]]
name  = "p"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = 2.0
    upper = 3.0
    initial_guess = 2.25
    initial_sigma = 0.25

#-------------- MODEL --------------
#---------------- k ----------------
[[model]]
name  = "k"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = -10.0
    upper = 3.0
    initial_guess = -5.0
    initial_sigma = 5.0

#-------------- MODEL --------------
#------------ tj (days) ------------
[[model]]
name  = "tj"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -1.0
    upper = 1.0

#-------------- MODEL --------------
#---------------- sj ---------------
[[model]]
name  = "sj"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = 0.1
    upper = 3.0

#-------------- MODEL --------------
#---------------- X ----------------
[[model]]
name  = "hmf"
scale = "linear"
value = 0.7

#-------------- MODEL --------------
#---------------- z ----------------
[[model]]
name  = "z"
scale = "linear"
value = 6.318

#-------------- MODEL --------------
#---------------- dL ---------------
[[model]]
name  = "dL28"
scale = "linear"
value = 18.70

#----------- EXTINCTION ------------
#---------- source_frame -----------
[[extinction]]
name  = "ebv_source_frame"
scale = "linear"

[extinction.prior]
    type  = "uniform"
    lower = 0.0
    upper = 0.5
    initial_guess = 0.05
    initial_sigma = 0.05

#----------- EXTINCTION ------------
#------------ milky_way ------------
[[extinction]]
name  = "ebv_milky_way"
scale = "linear"
value = 0.0298

#----------- CALIBRATION -----------
#-------------- I-band -------------
[[offsets]]
name  = "Ic_offset"
scale = "linear"

[offsets.prior]
    type  = "uniform"
    lower = 0.0
    upper = 2.4

#----------- CALIBRATION -----------
#-------------- J-band -------------
[[offsets]]
name  = "J_offset"
scale = "linear"

[offsets.prior]
    type  = "gaussian"
    mu    = 0.0
    sigma = 0.04

#----------- CALIBRATION -----------
#-------------- H-band -------------
[[offsets]]
name  = "H_offset"
scale = "linear"

[offsets.prior]
    type  = "gaussian"
    mu    = 0.0
    sigma = 0.05

#----------- CALIBRATION -----------
#-------------- K-band -------------
[[offsets]]
name  = "K_offset"
scale = "linear"

[offsets.prior]
    type  = "gaussian"
    mu = 0.0
    sigma = 0.04

#----------- CALIBRATION -----------
#-------------- i-band -------------
[[offsets]]
name  = "i_offset"
scale = "linear"

[offsets.prior]
    type  = "uniform"
    lower = 1.0
    upper = 4.5

#----------- CALIBRATION -----------
#-------------- z-band -------------
[[offsets]]
name  = "z_offset"
scale = "linear"

[offsets.prior]
    type  = "uniform"
    lower = -0.5
    upper = 1.6

#--------------- SLOP --------------
#--------------- slop --------------
[[slop]]
name  = "slop"
scale = "linear"

[slop.prior]
    type  = "uniform"
    lower = 0.0
    upper = 0.2
    initial_guess = 0.05
    initial_sigma = 0.05
