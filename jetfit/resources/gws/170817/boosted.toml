# MCMC Parameter Configuriation File
name = 'BoostedFireballModel'
# Source-frame dust-law references:
# Trotter, A. S. 2011, UNC-Chapel Hill PhD thesis, DOI 10.17615/2gjp-g156.
# Cardelli, Clayton, and Mathis 1989, ApJ, 345, 245 (CCM89).
# Allowed: "trotter2011" (default for new configs) or "ccm89".
source_extinction_model = 'ccm89'

#-------------- MODEL --------------
#---------------- E ----------------
[[model]]
name  = "E"
scale = "log"
value = -0.79944

#[model.prior]
#    type  = "uniform"
#    lower = -6.0
#    upper = 3.0

#-------------- MODEL --------------
#---------------- n ----------------
[[model]]
name  = "n0"
scale = "log"
value = -3.0056

#[model.prior]
#    type  = "uniform"
#    lower = -6.0
#    upper = 3.0

#-------------- MODEL --------------
#-------------- eta --------------
[[model]]
name  = "eta"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = 2.0
    upper = 15.0

#-------------- MODEL --------------
#-------------- gamma_b --------------
[[model]]
name  = "gamma_b"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = 1.0
    upper = 20.0

#-------------- MODEL --------------
#-------------- theta_obs --------------
[[model]]
name  = "theta_obs"
scale = "linear"

[model.prior]
    type  = "sine"
    lower = 0.0
    upper = 1.0

#-------------- MODEL --------------
#-------------- eps_e --------------
[[model]]
name  = "eps_e"
scale = "log"
value = -1.390109

#[model.prior]
#    type  = "uniform"
#    lower = -6.0
#    upper = 0.0

#-------------- MODEL --------------
#-------------- eps_b --------------
[[model]]
name  = "eps_b"
scale = "log"
value = -1.8753749

#[model.prior]
#    type  = "uniform"
#    lower = -6.0
#    upper = 0.0

#-------------- MODEL --------------
#---------------- p ----------------
[[model]]
name  = "p"
scale = "linear"
value = 2.13334

#[model.prior]
#    type  = "uniform"
#    lower = 2.0
#    upper = 4.0
    # initial_guess = 2.25
    # initial_sigma = 0.25

#-------------- MODEL --------------
#---------------- z ----------------
[[model]]
name  = "z"
scale = "linear"
value = 0.00973

#-------------- MODEL --------------
#---------------- dL ---------------
[[model]]
name  = "dL28"
scale = "linear"
value = 0.012188

#-------------- MODEL --------------
#---------------- zeta ---------------
[[model]]
name  = "zeta"
scale = "linear"
value = 1.0

