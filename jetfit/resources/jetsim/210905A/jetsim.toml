# MCMC Parameter Configuriation File
name = 'JetSimpy'
# Source-frame dust-law references:
# Trotter, A. S. 2011, UNC-Chapel Hill PhD thesis, DOI 10.17615/2gjp-g156.
# Cardelli, Clayton, and Mathis 1989, ApJ, 345, 245 (CCM89).
# Allowed: "trotter2011" (default for new configs) or "ccm89".
source_extinction_model = 'ccm89'

#-------------- MODEL --------------
#---------------- E ----------------
[[model]]
name  = "Eiso"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = 50.0
    upper = 56.0

#-------------- MODEL --------------
#---------------- n ----------------
[[model]]
name  = "n0"
scale = "linear"
value = 0.0

#-------------- MODEL --------------
#---------------- A ----------------
[[model]]
name  = "A"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 6.0

#-------------- MODEL --------------
#-------------- eps_e --------------
[[model]]
name  = "eps_e"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 0.0

#-------------- MODEL --------------
#-------------- eps_b --------------
[[model]]
name  = "eps_b"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 0.0

#-------------- MODEL --------------
#---------------- LF ---------------
[[model]]
name  = "lf"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = 2
    upper = 3

#-------------- MODEL --------------
#---------------- p ----------------
[[model]]
name  = "p"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = 2.0
    upper = 3.5
    initial_guess = 2.25
    initial_sigma = 0.25

#-------------- MODEL --------------
#------------- theta_c -------------
[[model]]
name  = "theta_c"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = 0.0
    upper = 1.0

#-------------- MODEL --------------
#------------- theta_v -------------
[[model]]
name  = "theta_v"
scale = "linear"
value = 0.0

[model.prior]
    type  = "uniform"
    lower = 0.0
    upper = 1.0

#-------------- MODEL --------------
#---------------- z ----------------
[[model]]
name  = "z"
scale = "linear"
value = 6.318

#-------------- MODEL --------------
#---------------- d ----------------
[[model]]
name  = "d"
scale = "linear"
value = 60602.572

#----------- EXTINCTION ------------
#---------- source_frame -----------
[[extinction]]
name  = "ebv_source_frame"
scale = "linear"

[extinction.prior]
    type  = "uniform"
    lower = 0.0
    upper = 1.0

#----------- EXTINCTION ------------
#------------ milky_way ------------
[[extinction]]
name  = "ebv_milky_way"
scale = "linear"
value = 0.0298

#----------- CALIBRATION -----------
#-------------- I-band -------------
[[offsets]]
name  = "Ic_offset"
scale = "linear"

[offsets.prior]
    type  = "uniform"
    lower = 0.0
    upper = 2.4

#----------- CALIBRATION -----------
#-------------- J-band -------------
[[offsets]]
name  = "J_offset"
scale = "linear"

[offsets.prior]
    type  = "gaussian"
    mu    = 0.0
    sigma = 0.04

#----------- CALIBRATION -----------
#-------------- H-band -------------
[[offsets]]
name  = "H_offset"
scale = "linear"

[offsets.prior]
    type  = "gaussian"
    mu    = 0.0
    sigma = 0.05

#----------- CALIBRATION -----------
#-------------- K-band -------------
[[offsets]]
name  = "K_offset"
scale = "linear"

[offsets.prior]
    type  = "gaussian"
    mu    = 0.0
    sigma = 0.04

#----------- CALIBRATION -----------
#-------------- i-band -------------
[[offsets]]
name  = "i_offset"
scale = "linear"

[offsets.prior]
    type  = "uniform"
    lower = 1.0
    upper = 5.0

#----------- CALIBRATION -----------
#-------------- z-band -------------
[[offsets]]
name  = "z_offset"
scale = "linear"

[offsets.prior]
    type  = "uniform"
    lower = -1.0
    upper = 2.0

#--------------- SLOP --------------
#--------------- slop --------------
[[slop]]
name  = "slop"
scale = "linear"

[slop.prior]
    type  = "uniform"
    lower = 0.0
    upper = 0.2
